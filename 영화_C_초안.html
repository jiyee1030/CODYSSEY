<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>영화 티어리스트</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  padding: 20px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid #333;
}
h1 { font-size: 22px; }
#headerBtns { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  background: #e94560;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
button:hover { background: #c73651; }
button.secondary { background: #0f3460; }
button.secondary:hover { background: #16498a; }
button.danger { background: #555; }
button.danger:hover { background: #777; }

/* 목록 화면 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.card {
  background: #16213e;
  border-radius: 10px;
  padding: 16px;
}
.card h3 { margin-bottom: 10px; color: #fff; cursor: pointer; }
.preview-tier {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0;
  font-size: 12px;
}
.tier-badge {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: #000;
  flex-shrink: 0;
}
.preview-movies {
  color: #aaa;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-actions { display: flex; gap: 8px; margin-top: 12px; }

/* 편집 화면 */
.tier-row {
  display: flex;
  margin-bottom: 8px;
  background: #16213e;
  border-radius: 8px;
  overflow: hidden;
  min-height: 70px;
}
.tier-label {
  width: 64px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: bold; color: #000;
  flex-shrink: 0;
}
.tier-movies {
  flex: 1;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-start;
  align-content: flex-start;
}
.tier-movies.drag-over { background: rgba(233, 69, 96, 0.2); }
.movie {
  background: #0f3460;
  padding: 6px 10px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: grab;
  font-size: 14px;
}
.movie.dragging { opacity: 0.4; }
.movie select {
  background: #16213e; color: #fff; border: 1px solid #444;
  border-radius: 4px; font-size: 11px; padding: 2px;
}
.movie button { padding: 2px 6px; font-size: 11px; background: #444; }
.movie button:hover { background: #e94560; }

.tier-S { background: #ff7f7f; }
.tier-A { background: #ffbf7f; }
.tier-B { background: #ffdf7f; }
.tier-C { background: #bfff7f; }
.tier-D { background: #7fbfff; }

.add-movie { display: flex; gap: 8px; margin: 0 0 20px; }
.add-movie input, .add-movie select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #0f3460;
  color: white;
  font-size: 14px;
}
.add-movie input { flex: 1; min-width: 0; }

.empty { text-align: center; color: #888; padding: 40px; }
.notice { background: #16213e; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; color: #ccc; font-size: 14px; }

/* 모달 */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-bg.show { display: flex; }
.modal {
  background: #16213e;
  padding: 24px;
  border-radius: 10px;
  width: min(360px, 90vw);
}
.modal h2 { margin-bottom: 16px; font-size: 18px; }
.modal input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #0f3460;
  color: white;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 16px; border-radius: 8px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">🎬 내 티어리스트</h1>
  <div id="headerBtns"></div>
</header>

<main id="main"></main>

<div class="modal-bg" id="newModal">
  <div class="modal">
    <h2>새 티어리스트 만들기</h2>
    <input type="text" id="newTitleInput" placeholder="제목을 입력하세요" />
    <div class="modal-actions">
      <button class="secondary" id="cancelNew">취소</button>
      <button id="confirmNew">만들기</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const TIERS = ['S', 'A', 'B', 'C', 'D'];
const STORAGE_KEY = 'movie_tierlists';

// ===== 데이터 관리 (저장소를 못 쓰는 환경이면 메모리로 대체) =====
let memoryData = [];
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return memoryData; }
}
function saveData(data) {
  memoryData = data;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}
function getTierlist(id) { return loadData().find(t => t.id === id); }
function updateTierlist(id, fn) {
  const data = loadData();
  const tl = data.find(t => t.id === id);
  if (tl) { fn(tl); saveData(data); }
}
function emptyTiers() {
  const o = {};
  TIERS.forEach(t => o[t] = []);
  return o;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ===== 라우팅 (URL 해시) =====
function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('edit/')) return { view: 'edit', id: h.slice(5) };
  if (h.startsWith('share/')) return { view: 'share', payload: h.slice(6) };
  return { view: 'list' };
}
window.addEventListener('hashchange', render);
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) render(); });

function render() {
  const r = parseHash();
  if (r.view === 'edit') renderEdit(r.id);
  else if (r.view === 'share') renderShared(r.payload);
  else renderList();
}

// ===== 목록 화면 =====
function renderList() {
  document.getElementById('pageTitle').textContent = '🎬 내 티어리스트';
  document.getElementById('headerBtns').innerHTML =
    '<button id="btnNew">+ 새로 만들기</button>';
  document.getElementById('btnNew').onclick = openModal;

  const data = loadData();
  const main = document.getElementById('main');
  if (data.length === 0) {
    main.innerHTML = '<div class="empty">아직 티어리스트가 없어요. \'새로 만들기\'를 눌러 시작해 보세요!</div>';
    return;
  }

  main.innerHTML = '<div class="card-grid">' + data.map(tl => `
    <div class="card">
      <h3 data-open="${tl.id}">${escapeHtml(tl.title)}</h3>
      ${TIERS.map(t => `
        <div class="preview-tier">
          <div class="tier-badge tier-${t}">${t}</div>
          <div class="preview-movies">${
            (tl.tiers[t] && tl.tiers[t].length)
              ? tl.tiers[t].map(escapeHtml).join(', ')
              : '-'
          }</div>
        </div>`).join('')}
      <div class="card-actions">
        <button data-open="${tl.id}">편집</button>
        <button class="secondary" data-share="${tl.id}">공유</button>
        <button class="danger" data-delete="${tl.id}">삭제</button>
      </div>
    </div>`).join('') + '</div>';

  main.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { location.hash = 'edit/' + el.dataset.open; });
  main.querySelectorAll('[data-share]').forEach(el => el.onclick = () => shareTierlist(el.dataset.share));
  main.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => deleteTierlist(el.dataset.delete));
}

// ===== 편집 화면 =====
function renderEdit(id) {
  const tl = getTierlist(id);
  if (!tl) { location.hash = ''; return; }

  document.getElementById('pageTitle').textContent = '✏️ ' + tl.title;
  document.getElementById('headerBtns').innerHTML =
    '<button class="secondary" id="btnShare">🔗 공유 링크 복사</button>' +
    '<button id="btnBack">← 목록으로</button>';
  document.getElementById('btnShare').onclick = () => shareTierlist(id);
  document.getElementById('btnBack').onclick = () => { location.hash = ''; };

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="add-movie">
      <input type="text" id="movieInput" placeholder="영화 제목을 입력하세요" />
      <select id="tierSelect">${TIERS.map(t => `<option value="${t}">${t} 티어</option>`).join('')}</select>
      <button id="btnAdd">추가</button>
    </div>
    ${TIERS.map(t => `
      <div class="tier-row">
        <div class="tier-label tier-${t}">${t}</div>
        <div class="tier-movies" data-tier="${t}">
          ${(tl.tiers[t] || []).map((m, i) => `
            <div class="movie" draggable="true" data-tier="${t}" data-index="${i}">
              <span>${escapeHtml(m)}</span>
              <select data-move>${TIERS.map(x => `<option value="${x}" ${x === t ? 'selected' : ''}>${x}</option>`).join('')}</select>
              <button data-remove>✕</button>
            </div>`).join('')}
        </div>
      </div>`).join('')}`;

  const input = document.getElementById('movieInput');
  const add = () => {
    const title = input.value.trim();
    if (!title) return;
    const tier = document.getElementById('tierSelect').value;
    updateTierlist(id, x => { (x.tiers[tier] = x.tiers[tier] || []).push(title); });
    renderEdit(id);
    document.getElementById('movieInput').focus();
  };
  document.getElementById('btnAdd').onclick = add;
  input.onkeydown = e => { if (e.key === 'Enter') add(); };

  // 삭제 / 티어 이동(셀렉트)
  main.querySelectorAll('.movie').forEach(el => {
    const tier = el.dataset.tier, idx = +el.dataset.index;
    el.querySelector('[data-remove]').onclick = () => {
      updateTierlist(id, x => x.tiers[tier].splice(idx, 1));
      renderEdit(id);
    };
    el.querySelector('[data-move]').onchange = e => moveMovie(id, tier, idx, e.target.value);

    // 드래그 앤 드롭 (PC)
    el.ondragstart = e => {
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', tier + ':' + idx);
      e.dataTransfer.effectAllowed = 'move';
    };
    el.ondragend = () => el.classList.remove('dragging');
  });
  main.querySelectorAll('.tier-movies').forEach(zone => {
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
    zone.ondragleave = () => zone.classList.remove('drag-over');
    zone.ondrop = e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const [fromTier, fromIdx] = e.dataTransfer.getData('text/plain').split(':');
      if (fromTier) moveMovie(id, fromTier, +fromIdx, zone.dataset.tier);
    };
  });
}

function moveMovie(id, fromTier, idx, toTier) {
  if (fromTier === toTier) return;
  updateTierlist(id, x => {
    const [m] = x.tiers[fromTier].splice(idx, 1);
    (x.tiers[toTier] = x.tiers[toTier] || []).push(m);
  });
  renderEdit(id);
}

// ===== 공유 =====
function encodeShare(tl) {
  const json = JSON.stringify({ title: tl.title, tiers: tl.tiers });
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeShare(payload) {
  try { return JSON.parse(decodeURIComponent(escape(atob(payload)))); }
  catch (e) { return null; }
}
function shareTierlist(id) {
  const tl = getTierlist(id);
  if (!tl) return;
  const url = location.href.split('#')[0] + '#share/' + encodeShare(tl);
  const done = () => toast('공유 링크를 복사했어요!');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
  } else fallbackCopy(url, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사에 실패했어요'); }
  ta.remove();
}

function renderShared(payload) {
  const shared = decodeShare(payload);
  document.getElementById('headerBtns').innerHTML =
    '<button id="btnSave">내 목록에 저장</button><button class="secondary" id="btnBack">← 목록으로</button>';
  document.getElementById('btnBack').onclick = () => { location.hash = ''; };
  const main = document.getElementById('main');

  if (!shared) {
    document.getElementById('pageTitle').textContent = '🔗 공유된 티어리스트';
    document.getElementById('btnSave').style.display = 'none';
    main.innerHTML = '<div class="empty">공유 링크가 올바르지 않아요.</div>';
    return;
  }
  document.getElementById('pageTitle').textContent = '🔗 ' + shared.title;
  document.getElementById('btnSave').onclick = () => {
    const data = loadData();
    const id = 't' + Date.now();
    data.push({ id, title: shared.title, tiers: Object.assign(emptyTiers(), shared.tiers) });
    saveData(data);
    location.hash = 'edit/' + id;
  };
  main.innerHTML = '<div class="notice">공유받은 티어리스트예요. 저장하면 내 목록에서 편집할 수 있어요.</div>' +
    TIERS.map(t => `
      <div class="tier-row">
        <div class="tier-label tier-${t}">${t}</div>
        <div class="tier-movies">
          ${((shared.tiers && shared.tiers[t]) || []).map(m => `<div class="movie" style="cursor:default"><span>${escapeHtml(m)}</span></div>`).join('')}
        </div>
      </div>`).join('');
}

// ===== 새로 만들기 / 삭제 =====
function openModal() {
  document.getElementById('newModal').classList.add('show');
  const input = document.getElementById('newTitleInput');
  input.value = '';
  input.focus();
}
function closeModal() { document.getElementById('newModal').classList.remove('show'); }
function createTierlist() {
  const title = document.getElementById('newTitleInput').value.trim();
  if (!title) return;
  const data = loadData();
  const id = 't' + Date.now();
  data.push({ id, title, tiers: emptyTiers() });
  saveData(data);
  closeModal();
  location.hash = 'edit/' + id;
}
function deleteTierlist(id) {
  const tl = getTierlist(id);
  if (!tl) return;
  // 브라우저 확인창 대신 한 번 더 누르면 삭제되는 방식
  const btn = document.querySelector(`[data-delete="${id}"]`);
  if (btn && btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.textContent = '정말 삭제?';
    setTimeout(() => { if (btn) { btn.dataset.armed = ''; btn.textContent = '삭제'; } }, 2500);
    return;
  }
  saveData(loadData().filter(t => t.id !== id));
  renderList();
}

document.getElementById('cancelNew').onclick = closeModal;
document.getElementById('confirmNew').onclick = createTierlist;
document.getElementById('newTitleInput').onkeydown = e => { if (e.key === 'Enter') createTierlist(); };
document.getElementById('newModal').onclick = e => { if (e.target.id === 'newModal') closeModal(); };

render();
</script>
</body>
</html>
