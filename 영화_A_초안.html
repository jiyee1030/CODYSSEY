<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영화 티어리스트</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
--bg: #0f0f13;
--surface: #1a1a24;
--surface2: #22222f;
--border: #2e2e40;
--text: #e8e8f0;
--text-muted: #7a7a9a;
--accent: #7c6af7;
--accent-hover: #9d8fff;
--danger: #e05555;
--s-color: #ff6b6b;
--a-color: #ffa94d;
--b-color: #ffe066;
--c-color: #69db7c;
--d-color: #74c0fc;
--radius: 10px;
--shadow: 0 4px 24px rgba(0,0,0,0.4);
}
body {
background: var(--bg);
color: var(--text);
font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
min-height: 100vh;
}
header {
background: var(--surface);
border-bottom: 1px solid var(--border);
padding: 0 24px;
height: 60px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 100;
}
.logo { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
.logo span { color: var(--text); }
.header-btns { display: flex; gap: 10px; }
.btn {
border: none; border-radius: 8px; padding: 8px 16px;
font-size: 0.85rem; font-weight: 600; cursor: pointer;
transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost {
background: transparent; color: var(--text-muted);
border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c94444; }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; }
main { padding: 32px 24px; max-width: 1100px; margin: 0 auto; }
#page-editor { display: none; }
.home-top {
display: flex; align-items: center;
justify-content: space-between; margin-bottom: 24px;
}
.home-top h1 { font-size: 1.4rem; font-weight: 700; }
.card-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 18px;
}
.list-card {
background: var(--surface); border: 1px solid var(--border);
border-radius: var(--radius); padding: 18px; cursor: pointer;
transition: border-color 0.15s, transform 0.15s; position: relative;
}
.list-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.list-card h3 {
font-size: 1rem; font-weight: 700; margin-bottom: 10px;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
padding-right: 24px;
}
.card-preview { display: flex; flex-direction: column; gap: 4px; }
.card-preview-row {
display: flex; align-items: center; gap: 6px;
font-size: 0.78rem; color: var(--text-muted);
}
.tier-badge {
width: 20px; height: 20px; border-radius: 4px;
display: flex; align-items: center; justify-content: center;
font-size: 0.7rem; font-weight: 800; color: #000; flex-shrink: 0;
}
.tier-badge.S { background: var(--s-color); }
.tier-badge.A { background: var(--a-color); }
.tier-badge.B { background: var(--b-color); }
.tier-badge.C { background: var(--c-color); }
.tier-badge.D { background: var(--d-color); }
.card-delete-btn {
position: absolute; top: 10px; right: 10px;
background: transparent; border: none; color: var(--text-muted);
cursor: pointer; font-size: 1rem; line-height: 1;
padding: 2px 5px; border-radius: 4px;
transition: color 0.15s, background 0.15s;
}
.card-delete-btn:hover { color: var(--danger); background: rgba(224,85,85,0.12); }
.empty-state { text-align: center; padding: 80px 0; color: var(--text-muted); }
.empty-state p { margin-bottom: 16px; font-size: 1rem; }
.editor-top {
display: flex; align-items: center; gap: 12px;
margin-bottom: 28px; flex-wrap: wrap;
}
.editor-title-input {
background: transparent; border: none;
border-bottom: 2px solid var(--border); color: var(--text);
font-size: 1.3rem; font-weight: 700; padding: 4px 2px;
outline: none; flex: 1; min-width: 160px;
transition: border-color 0.15s;
}
.editor-title-input:focus { border-bottom-color: var(--accent); }
.editor-actions { display: flex; gap: 8px; margin-left: auto; }
.tier-list { display: flex; flex-direction: column; gap: 6px; }
.tier-row {
display: flex; align-items: stretch;
border-radius: var(--radius); overflow: hidden;
border: 1px solid var(--border); min-height: 72px;
}
.tier-label {
width: 64px; flex-shrink: 0;
display: flex; align-items: center; justify-content: center;
font-size: 1.6rem; font-weight: 900; color: #000;
}
.tier-label.S { background: var(--s-color); }
.tier-label.A { background: var(--a-color); }
.tier-label.B { background: var(--b-color); }
.tier-label.C { background: var(--c-color); }
.tier-label.D { background: var(--d-color); }
.tier-drop-zone {
flex: 1; display: flex; flex-wrap: wrap;
align-items: center; gap: 8px; padding: 10px 12px;
background: var(--surface2); min-height: 72px;
transition: background 0.15s;
}
.tier-drop-zone.drag-over {
background: rgba(124,106,247,0.12);
outline: 2px dashed var(--accent); outline-offset: -2px;
}
.movie-chip {
background: var(--surface); border: 1px solid var(--border);
border-radius: 6px; padding: 6px 10px; font-size: 0.85rem;
display: flex; align-items: center; gap: 6px;
cursor: grab; user-select: none;
transition: border-color 0.15s, box-shadow 0.15s; white-space: nowrap;
}
.movie-chip:hover { border-color: var(--accent); }
.movie-chip.dragging { opacity: 0.4; cursor: grabbing; }
.chip-del {
background: none; border: none; color: var(--text-muted);
cursor: pointer; font-size: 0.9rem; line-height: 1;
padding: 0 2px; border-radius: 3px; transition: color 0.15s;
}
.chip-del:hover { color: var(--danger); }
.unranked-section {
margin-top: 24px; background: var(--surface);
border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
}
.unranked-section h3 {
font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;
font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.unranked-drop-zone {
display: flex; flex-wrap: wrap; gap: 8px;
min-height: 48px; border-radius: 6px; padding: 4px;
transition: background 0.15s;
}
.unranked-drop-zone.drag-over {
background: rgba(124,106,247,0.08);
outline: 2px dashed var(--accent); outline-offset: -2px;
}
.add-movie-form { display: flex; gap: 8px; margin-top: 12px; }
.add-movie-input {
flex: 1; background: var(--surface2); border: 1px solid var(--border);
border-radius: 8px; color: var(--text); font-size: 0.9rem;
padding: 8px 12px; outline: none; transition: border-color 0.15s;
}
.add-movie-input:focus { border-color: var(--accent); }
.add-movie-input::placeholder { color: var(--text-muted); }
.modal-overlay {
display: none; position: fixed; inset: 0;
background: rgba(0,0,0,0.6); z-index: 200;
align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
background: var(--surface); border: 1px solid var(--border);
border-radius: 14px; padding: 28px; width: 360px;
box-shadow: var(--shadow);
}
.modal h2 { font-size: 1.1rem; margin-bottom: 8px; }
.modal p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; }
.modal-input {
width: 100%; background: var(--surface2); border: 1px solid var(--border);
border-radius: 8px; color: var(--text); font-size: 0.95rem;
padding: 10px 12px; outline: none; margin-bottom: 18px;
transition: border-color 0.15s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.share-box { display: flex; gap: 8px; margin-bottom: 18px; }
.share-url-input {
flex: 1; background: var(--surface2); border: 1px solid var(--border);
border-radius: 8px; color: var(--text-muted); font-size: 0.8rem;
padding: 8px 10px; outline: none;
}
#toast {
position: fixed; bottom: 32px; left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(--surface); border: 1px solid var(--border);
color: var(--text); padding: 10px 20px; border-radius: 30px;
font-size: 0.88rem; opacity: 0;
transition: opacity 0.2s, transform 0.2s;
pointer-events: none; z-index: 999; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 600px) {
main { padding: 20px 14px; }
.tier-label { width: 48px; font-size: 1.3rem; }
.modal { width: calc(100vw - 32px); }
}
</style>
</head>
<body>

<header>
<div class="logo">🎬 <span>영화</span> 티어리스트</div>
<div class="header-btns">
<button class="btn btn-ghost" id="btn-home" style="display:none">← 목록으로</button>
</div>
</header>

<main>
<!-- 홈 페이지 -->
<div id="page-home">
<div class="home-top">
<h1>내 티어리스트</h1>
<button class="btn btn-primary" id="btn-new">+ 새 리스트 만들기</button>
</div>
<div class="card-grid" id="card-grid"></div>
<div class="empty-state" id="empty-state" style="display:none">
<p>아직 만든 티어리스트가 없어요 🎬</p>
<button class="btn btn-primary" id="btn-new2">첫 리스트 만들기</button>
</div>
</div>

<!-- 에디터 페이지 -->
<div id="page-editor">
<div class
